# ==============================================================================
# Default Configuration for Bi-Temporal Ante-Hoc Siamese 3D Res-Axial Network
# (DLC-Net) — Longitudinal Alzheimer's Disease Progression Detection
# ==============================================================================

project:
  name: "alzheimers_siamese_xai"
  model_name: "BiTemporalSiameseDLCNet"
  seed: 42
  device: "cuda"              # Automatically falls back to "cpu" if CUDA is unavailable
  use_amp: true               # Automatic Mixed Precision (torch.amp.autocast)
  use_checkpoint: true        # Gradient checkpointing in 3D Axial Attention blocks

data:
  data_root: "./data/preprocessed_128"
  manifest_csv: "./data/preprocessed_128/manifest.csv"
  mni_template_path: "./data/templates/MNI152_T1_1mm_brain.nii.gz"
  output_preprocessed_dir: "./data/preprocessed_128"
  target_shape: [128, 128, 128]
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  batch_size: 2
  num_workers: 0
  pin_memory: true
  augment_train: true
  intensity_clip_percentiles: [0.5, 99.5]

preprocessing:
  n4_shrink_factor: 4
  n4_iterations: [50, 50, 30, 20]
  n4_convergence_threshold: 1.0e-6
  registration_bins: 50
  registration_lr: 1.0
  registration_min_step: 1.0e-4
  registration_iterations: 200
  skull_strip_closing_radius: 5

model:
  in_channels: 1
  spatial_size: [128, 128, 128]
  gate:
    in_channels: 2            # [X_t || |X_2 - X_1|]
    hidden_channels: 8
    out_channels: 1
    kernel_size: 3
  backbone:
    stem_channels: 16
    stage1_channels: 32
    stage2_channels: 64
    stage3_channels: 128
    stage2_spatial_dim: 32
    stage3_spatial_dim: 16
    axial_num_heads: 4
    axial_dropout: 0.10
    leaky_relu_slope: 0.01
    latent_dim: 128
  progression_head:
    latent_dim: 128
    fusion_dim: 258           # [delta_s (1) || delta (1) || (z_2 - z_1) (128) || |z_2 - z_1| (128)]
    hidden_dim: 64
    dropout: 0.50
    num_classes: 3            # 0: Stable, 1: Progressing, 2: Advanced
    delta_t_min: 1.0e-3

loss:
  class_weights: [1.0, 2.8, 1.8]  # Weights for [Stable, Progressing, Advanced]
  label_smoothing: 0.05           # Regularize overconfident CE predictions
  lambda_1: 0.5                   # Weight for monotonic severity ranking loss
  lambda_2: 0.05                  # Weight for L1 saliency mask sparsity loss
  epsilon: 0.10                   # Margin for progressing pairs (y in {1, 2}): s_2 - s_1 >= epsilon
  epsilon_stable: 0.05            # Tolerance for stable pairs (y == 0): |s_2 - s_1| <= epsilon_stable

training:
  epochs: 30
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 2.0e-2
  grad_clip_norm: 1.0
  val_interval: 1
  early_stopping_patience: 10
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"

evaluation:
  compute_counterfactual_drop: true
  progression_classes: [1, 2]
  visualization_dir: "./visualizations"
  slice_indices: [48, 64, 80]
